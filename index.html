<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B3D24"><link rel="manifest" href="manifest.json"><title>Les comptes des Verts — Supporter</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><button id="installApp" style="display:none">📲 Installer l'application</button>
<main id="app"><div class="card"><h1>Les comptes des Verts</h1><p>Chargement…</p></div></main><script>
let deferredInstallPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installApp');
  btn.style.display = 'block';

  btn.onclick = async () => {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    btn.style.display = 'none';
  };
});

window.addEventListener('appinstalled', () => {
  document.getElementById('installApp').style.display = 'none';
  deferredInstallPrompt = null;
});
</script><script src="app.js"></script></body></html>
